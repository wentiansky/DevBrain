services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    image: ${REGISTRY:-}${IMAGE_PREFIX:-devbrain/}postgres:${IMAGE_TAG:-16}
    container_name: devbrain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devbrain}
      POSTGRES_DB: ${POSTGRES_DB:-devbrain}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-devbrain} -d ${POSTGRES_DB:-devbrain}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devbrain-redis
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  migrate:
    image: ${REGISTRY:-}${IMAGE_PREFIX:-devbrain/}api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: devbrain-migrate
    command: ['prisma', 'migrate', 'deploy', '--schema=/app/prisma/schema.prisma']
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://devbrain:devbrain@postgres:5432/devbrain}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'

  api:
    image: ${REGISTRY:-}${IMAGE_PREFIX:-devbrain/}api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: devbrain-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://devbrain:devbrain@postgres:5432/devbrain}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: '3001'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-devbrain_refresh}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/auth}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STORAGE_SIGNATURE_SECRET: ${STORAGE_SIGNATURE_SECRET:-}
      STORAGE_TOKEN_TTL_SECONDS: ${STORAGE_TOKEN_TTL_SECONDS:-300}
      DEV_STORAGE_ROOT: /home/node/devbrain-storage
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-mock}
      RERANK_MODEL: ${RERANK_MODEL:-gte-rerank-v2}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-30000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus-2025-12-01}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      RETRIEVAL_LOW_RELEVANCE_THRESHOLD: ${RETRIEVAL_LOW_RELEVANCE_THRESHOLD:-0.2}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    volumes:
      - storagedata:/home/node/devbrain-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - web
      - internal
    restart: unless-stopped

  web:
    image: ${REGISTRY:-}${IMAGE_PREFIX:-devbrain/}web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: devbrain-web
    environment:
      API_URL: ${API_URL:-http://api:3001}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    networks:
      - web
    restart: unless-stopped

  worker:
    image: ${REGISTRY:-}${IMAGE_PREFIX:-devbrain/}worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: devbrain-worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://devbrain:devbrain@postgres:5432/devbrain}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STORAGE_SIGNATURE_SECRET: ${STORAGE_SIGNATURE_SECRET:-}
      STORAGE_TOKEN_TTL_SECONDS: ${STORAGE_TOKEN_TTL_SECONDS:-300}
      DEV_STORAGE_ROOT: /home/node/devbrain-storage
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - storagedata:/home/node/devbrain-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  backup:
    image: ${REGISTRY:-}${IMAGE_PREFIX:-devbrain/}backup:${IMAGE_TAG:-latest}
    container_name: devbrain-backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devbrain}
      POSTGRES_DB: ${POSTGRES_DB:-devbrain}
      POSTGRES_HOST: postgres
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      BETTERSTACK_HEARTBEAT_URL: ${BETTERSTACK_HEARTBEAT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: devbrain-caddy
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - web
      - api
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  caddydata:
  storagedata:
