name: 构建并推送 GHCR 镜像

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: devbrain

jobs:
  build-and-push:
    name: 构建 ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            image: devbrain-api
          - service: web
            dockerfile: apps/web/Dockerfile
            image: devbrain-web
          - service: worker
            dockerfile: apps/worker/Dockerfile
            image: devbrain-worker
          - service: postgres
            dockerfile: infra/postgres/Dockerfile
            image: devbrain-postgres

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 校验 Web 构建期 Sentry DSN
        if: matrix.service == 'web'
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          if [ -z "$NEXT_PUBLIC_SENTRY_DSN" ]; then
            echo "缺少 GitHub Repository Variable：NEXT_PUBLIC_SENTRY_DSN。该值会在 Next.js 构建阶段内联进浏览器 bundle。"
            exit 1
          fi

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}

      - name: 写入摘要
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo ""
            echo "- IMAGE_TAG: sha-${{ github.sha }}"
            echo "- Image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
